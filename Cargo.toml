[workspace]
resolver = "2"
members = [
    "crates/clavis-core",
    "crates/clavis-store",
    "crates/clavis-sync",
    "crates/clavis-providers",
    "crates/clavis-cli",
    "crates/clavis-ffi",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://example.invalid/clavis/clavis"
rust-version = "1.85"

[workspace.dependencies]
clavis-core = { path = "crates/clavis-core" }
clavis-store = { path = "crates/clavis-store" }
clavis-sync = { path = "crates/clavis-sync" }
clavis-providers = { path = "crates/clavis-providers" }

argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
base64 = "0.22"
thiserror = "2"
ts-rs = { version = "11", features = ["serde-json-impl", "uuid-impl"] }
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
quick-xml = "0.37"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
ratatui = "0.29"
crossterm = "0.28"
uniffi = "0.29"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
