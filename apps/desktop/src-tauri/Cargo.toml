[package]
name = "clavis-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Clavis desktop Tauri shell: narrow typed commands, OS lifecycle, browser launch and clipboard"

[lib]
name = "clavis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
clavis-core = { workspace = true }
clavis-store = { workspace = true }
clavis-sync = { workspace = true }
clavis-providers = { workspace = true }
tauri = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
secrecy = { workspace = true }
